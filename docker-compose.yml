version: '3.8'

services:
  si-api:
    build: .
    container_name: si-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRES_IN=8h
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - RATE_LIMIT_MAX=200
      - TZ=Asia/Makassar
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
